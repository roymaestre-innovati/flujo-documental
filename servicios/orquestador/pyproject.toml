[project]
name = "orquestador"
dynamic = ["version"]
description = "Orquestador del flujo documental (módulo 5, spec 005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "normalizacion",
    "jsonschema>=4.23",
    "rfc3987>=1.3.8",
    "rfc3339-validator>=0.1.4",
]

[project.scripts]
orquestar = "orquestador.cli:main"

[tool.uv.sources]
normalizacion = { path = "../normalizacion", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.1.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/orquestador/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orquestador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "libreoffice: necesita el comando soffice; se salta si no está instalado",
]
