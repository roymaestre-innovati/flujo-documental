[project]
name = "orquestador"
dynamic = ["version"]
description = "Orquestador del flujo documental (módulo 5, spec 005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "normalizacion[azure]",
    "jsonschema>=4.23",
    "rfc3987>=1.3.8",
    "rfc3339-validator>=0.1.4",
    "azure-identity>=1.19",
    "azure-storage-file-datalake>=12.18",
    "deltalake>=1.6",
    "pyarrow>=18",
    "pymongo>=4.10",
    "azure-servicebus>=7.14",
]

[project.scripts]
orquestar = "orquestador.cli:main"
visor = "orquestador.visor.servidor:main"

[tool.uv.sources]
normalizacion = { path = "../normalizacion", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.1.0",
    "openpyxl>=3.1.5",
    "mongomock>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/orquestador/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orquestador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["scripts"]
markers = [
    "libreoffice: necesita el comando soffice; se salta si no está instalado",
    "azure(variable): usa recursos de Azure; requiere --azure y declarar la variable de entorno",
]
