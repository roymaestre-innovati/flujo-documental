[project]
name = "extraccion"
dynamic = ["version"]
description = "Extracción de los datos de cada segmento de documento (módulo 3, spec 003, entrega 2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "normalizacion",
    "jsonschema>=4.23",
    "rfc3987>=1.3.8",
    "rfc3339-validator>=0.1.4",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
    "openpyxl>=3.1.5",
    "openai>=3.49.0",
]

[tool.uv.sources]
normalizacion = { path = "../normalizacion", editable = true }

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/extraccion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/extraccion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
